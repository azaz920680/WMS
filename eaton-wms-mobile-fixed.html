<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eaton 蘆竹 UPS 倉儲管理系統</title>
<!-- xlsx-js-style is API-compatible with SheetJS and preserves Excel cell styles on export. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F3F5F7;
  --surface:#FFFFFF;
  --surface-2:#F8F9FB;
  --ink:#141C28;
  --ink-soft:#5B6B7C;
  --ink-faint:#8B98A6;
  --border:#DEE3E9;
  --border-strong:#C6CDD6;
  --accent:#2C5F8A;
  --accent-dark:#1D435F;
  --accent-bg:#E7EFF5;
  --success:#1E7F5C;
  --success-bg:#E6F4EF;
  --warning:#B54708;
  --warning-bg:#FDF0E5;
  --shipped:#8A93A0;
  --shipped-bg:#EFF1F3;
  --pending-bg:#FFF3B0;
  --pending-border:#E8D66A;
  --abnormal-bg:#FDE7E7;
  --abnormal-border:#F3AFAF;
  --abnormal-ink:#B42318;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:var(--sans);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Header ---------- */
header.topbar{
  background:var(--accent-dark);
  color:#fff;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .name{font-size:17px;font-weight:600;letter-spacing:0.3px;}
.brand .sub{font-size:12px;color:#B9CBDA;}
nav.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.08);padding:4px;border-radius:8px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  background:transparent;border:none;color:#CFE0EC;padding:8px 16px;border-radius:6px;
  font-size:13.5px;font-weight:500;cursor:pointer;font-family:var(--sans);white-space:nowrap;flex:0 0 auto;
}
nav.tabs button.active{background:#fff;color:var(--accent-dark);}
nav.tabs button:not(.active):hover{background:rgba(255,255,255,0.12);}

@media (max-width:720px){
  header.topbar{padding:12px 14px;}
  .brand .name{font-size:15px;}
  .brand .sub{font-size:11px;}
  nav.tabs{width:100%;justify-content:flex-start;}
  nav.tabs button{font-size:12px;padding:7px 11px;}
}

main{flex:1;padding:20px 24px 60px;max-width:1400px;width:100%;margin:0 auto;}

/* ---------- Cards / summary ---------- */
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;min-width:150px;flex:1;
}
.stat-card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.stat-card .value{font-family:var(--sans);font-variant-numeric:normal;font-feature-settings:'zero' 0;font-size:22px;font-weight:600;color:var(--ink);}
.stat-card .value.accent{color:var(--accent);}
.stat-card .value.warn{color:var(--warning);}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar .spacer{flex:1;}
input[type=text],input[type=date],input[type=number],select,textarea{
  font-family:var(--sans);font-size:13.5px;padding:8px 10px;border:1px solid var(--border-strong);
  border-radius:6px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
button{cursor:pointer;font-family:var(--sans);}
.btn{
  padding:8px 16px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;
  color:var(--ink);font-size:13.5px;font-weight:500;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-danger{color:#B42318;border-color:#F0C4C0;background:#fff;}
.btn-danger:hover{background:#FEF3F2;}
.btn-sm{padding:5px 10px;font-size:12.5px;}

/* ---------- Table ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
th{
  text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--ink-soft);
  font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;
  position:sticky;top:0;
}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tr.row-shipped td{color:var(--shipped);background:var(--shipped-bg);}
tr.row-shipped td.sku-cell{color:var(--ink-soft);}
tr.row-abnormal td{background:var(--abnormal-bg);}
tr.row-abnormal:hover td{background:#FBDADA;}
tr:hover td{background:var(--accent-bg);}
tr.row-shipped:hover td{background:#E7E9EC;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.badge-instock{background:var(--success-bg);color:var(--success);}
.badge-shipped{background:var(--shipped-bg);color:var(--shipped);}
.badge-alert{background:var(--warning-bg);color:var(--warning);}
.mono{font-family:var(--sans);font-variant-numeric:normal;font-feature-settings:'zero' 0;}
.num{text-align:right;font-family:var(--sans);font-variant-numeric:normal;font-feature-settings:'zero' 0;}
.actions-cell{display:flex;gap:6px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:88vh;overflow:auto;}
.modal h3{margin:0 0 16px;font-size:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.form-grid label.full{grid-column:1/-1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* ---------- Billing ---------- */
.period-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
.period-bar label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.assumption-note{background:var(--accent-bg);border:1px solid #C9DCE9;border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--accent-dark);margin-bottom:16px;line-height:1.6;}
.totals-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-top:16px;display:flex;flex-wrap:wrap;gap:24px;}
.totals-panel .item{min-width:130px;}
.totals-panel .item .l{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
.totals-panel .item .v{font-family:var(--sans);font-variant-numeric:normal;font-feature-settings:'zero' 0;font-size:17px;font-weight:600;}
.totals-panel .item.grand .v{font-size:22px;color:var(--accent);}
.mini-input{width:56px;padding:5px 6px;font-size:12.5px;}
.mini-input.wide{width:78px;}
.checkbox-cell{text-align:center;}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;}

/* ---------- Settings ---------- */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;max-width:640px;}
.settings-card h4{margin:22px 0 10px;font-size:13px;color:var(--ink-soft);text-transform:none;border-bottom:1px solid var(--border);padding-bottom:6px;}
.settings-card h4:first-child{margin-top:0;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.settings-grid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.settings-grid label.full{grid-column:1/-1;}

/* ---------- Putaway ---------- */
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;}
.sub-tabs button{
  background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-soft);
  padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;
}
.sub-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.batch-form{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
.batch-form .top-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
.batch-form .top-row label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.draft-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.draft-row input{flex:1;min-width:110px;}
.draft-row input.qty{max-width:110px;flex:none;}
.batch-list{display:grid;gap:10px;}
.batch-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.batch-item .info{flex:1;min-width:160px;}
.batch-item .date{font-weight:600;font-size:14px;}
.batch-item .prog{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.progress-bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;width:140px;margin-top:6px;}
.progress-bar .fill{height:100%;background:var(--success);}
.current-card{
  background:var(--surface);border:2px solid var(--accent);border-radius:12px;
  padding:20px;margin-bottom:18px;
}
.current-card .meta{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
.current-card .meta b{color:var(--ink);font-size:15px;}
.current-card .scan-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.current-card .scan-row input{flex:1;min-width:180px;font-size:16px;padding:12px 14px;}
.current-card .scan-row button{padding:12px 20px;font-size:14px;}
.btn-camera{white-space:nowrap;}
.camera-scanner{background:#fff;border-radius:12px;padding:18px;width:min(92vw,520px);max-height:90vh;overflow:auto;}
.camera-scanner h3{margin:0 0 12px;font-size:16px;}
#location-camera-reader{width:100%;min-height:240px;background:#111;border-radius:8px;overflow:hidden;}
#location-camera-reader video{width:100% !important;height:auto !important;}
.camera-scanner .hint{color:var(--ink-soft);font-size:12.5px;margin:10px 0 14px;}
.putaway-confirm{background:#fff;border-radius:14px;padding:28px;width:min(94vw,580px);text-align:center;}
.putaway-confirm h3{font-size:22px;margin:0 0 14px;}
.putaway-confirm p{font-size:18px;margin:0;white-space:nowrap;}
.putaway-confirm .confirm-actions{display:flex;flex-direction:row;flex-wrap:nowrap;gap:12px;margin-top:26px;}
.putaway-confirm .confirm-actions button{flex:1;font-size:17px;padding:12px 10px;}
.batch-detail-list{display:grid;gap:8px;}
.batch-detail-row{border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;}
.batch-detail-row .label{color:var(--ink-soft);}
.batch-detail-row .pstatus{justify-self:end;background:var(--success-bg);color:var(--success);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;}
.done-banner{background:var(--success-bg);color:var(--success);border-radius:12px;padding:22px;text-align:center;font-size:15px;font-weight:600;margin-bottom:18px;}
.putaway-ready-banner{font-size:18px;line-height:1.8;}
.putaway-ready-banner .btn{font-size:16px;padding:11px 24px;margin-top:4px;}
.pallet-cards{display:grid;gap:8px;}
.pallet-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.pallet-card.is-pending{border-left:4px solid var(--pending-border);}
.pallet-card.is-done{border-left:4px solid var(--success);}
.pallet-card.is-current{border-color:var(--accent);border-left-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px rgba(44,95,138,0.16);}
.pallet-card.is-abnormal{background:var(--abnormal-bg);border-color:var(--abnormal-border);}
.pallet-card .pinfo{min-width:150px;font-size:12.5px;color:var(--ink-soft);}
.pallet-card .pinfo b{color:var(--ink);font-size:13.5px;}
.pallet-card .ploc{width:130px;}
.pallet-card .ploc.pending-bg{background:var(--pending-bg);}
.pallet-card .pabn{width:150px;}
.pallet-card .pabn.has-text{background:var(--abnormal-bg);color:var(--abnormal-ink);}
.pallet-card .pstatus{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.pallet-card .pstatus.pending{background:var(--surface-2);color:var(--ink-faint);}
.pallet-card .pstatus.staged{background:var(--accent-bg);color:var(--accent-dark);}
.pallet-card .pstatus.done{background:var(--pending-bg);color:#7A5F00;}
.jump-link{font-size:12px;color:var(--accent);background:none;border:none;text-decoration:underline;padding:0;}

/* ---------- Outbound / Delivery Note ---------- */
.ob-row-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.ob-row-card .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.ob-row-card .head .sku{font-weight:600;font-size:15px;}
.ob-row-card .head .need{font-size:12.5px;color:var(--ink-soft);}
.ob-status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
.ob-status.ok{background:var(--success-bg);color:var(--success);}
.ob-status.short{background:var(--abnormal-bg);color:var(--abnormal-ink);}
.ob-cand-list{display:grid;gap:6px;}
.ob-cand{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;flex-wrap:wrap;}
.ob-cand.checked{border-color:var(--accent);background:var(--accent-bg);}
.ob-cand .oldest-tag{font-size:10.5px;background:var(--success);color:#fff;padding:2px 6px;border-radius:10px;}
.ship-form{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
.ship-form .top-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
.ship-form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.ship-history-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.ship-history-item .info{flex:1;min-width:160px;}

/* Delivery note print layout */
.dn-sheet{background:#fff;border:1px solid var(--border);border-radius:6px;padding:clamp(20px,5vw,56px) clamp(16px,7vw,90px);width:100%;max-width:1100px;margin:0 auto;box-shadow:0 4px 18px rgba(20,28,40,0.10);font-size:clamp(13px,1.6vw,16px);}
.dn-sheet h2{text-align:center;font-size:clamp(16px,2.6vw,28px);margin:0;flex:1;}
.dn-header{display:flex;align-items:center;gap:clamp(10px,2vw,24px);margin-bottom:clamp(16px,3vw,34px);flex-wrap:wrap;}
.dn-logo{height:clamp(28px,5vw,56px);width:auto;object-fit:contain;}
.dn-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-bottom:22px;}
.dn-grid .block{font-size:inherit;line-height:2;}
.dn-grid .block b{display:block;font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;letter-spacing:0.2px;}
.dn-grid .block.dn-right{text-align:right;}
.dn-grid .block.dn-right b{text-align:right;}
.dn-time-static{color:var(--ink);font-size:inherit;}
.dn-sheet .dn-field{
  width:100%;border:none;border-bottom:1px solid transparent;background:transparent;
  padding:4px 2px;font-size:inherit;font-family:var(--sans);color:var(--ink);border-radius:0;
}
.dn-sheet .dn-field:hover{border-bottom-color:var(--border);}
.dn-sheet .dn-field:focus{outline:none;border-bottom-color:var(--accent);}
.dn-grid .block.dn-right .dn-field{width:160px;margin-left:auto;text-align:right;}
.dn-section-title{background:var(--surface-2);font-weight:600;font-size:14.5px;padding:9px 12px;margin:20px 0 10px;border-radius:4px;}
.dn-section-title-boxed{text-align:center;border:1px solid var(--border-strong);border-radius:0;}
.dn-table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin-bottom:18px;}
.dn-table{width:100%;border-collapse:collapse;margin-bottom:18px;}
.dn-table-wrap .dn-table{margin-bottom:0;}
.dn-table th,.dn-table td{border:1px solid var(--border-strong);padding:clamp(6px,1.2vw,12px) clamp(6px,1.4vw,14px);font-size:clamp(11px,1.4vw,15.5px);text-align:center;}
.dn-detail-table{margin-top:4px;}
tr.dn-shipped-row td{background:var(--shipped-bg);color:var(--shipped);}
.dn-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}
@media (max-width:720px){
  .dn-sheet{padding:20px 16px;max-width:none;min-width:0;overflow:hidden;}
  .dn-grid{grid-template-columns:1fr;gap:14px 0;}
  .dn-grid .block.dn-right{text-align:left;}
  .dn-grid .block.dn-right b{text-align:left;}
  .dn-grid .block.dn-right .dn-field{margin-left:0;text-align:left;}
  .dn-table th,.dn-table td{padding:6px 5px;font-size:11.5px;}
  .dn-sheet .dn-table{min-width:0;table-layout:fixed;}
  .dn-sheet .dn-table th,.dn-sheet .dn-table td{white-space:normal;overflow-wrap:anywhere;}
  /* 明細表固定在手機可視寬度內，讓使用者需要時以瀏覽器縮放閱讀。 */
  .dn-sheet .dn-detail-table{min-width:0;table-layout:fixed;}
  .dn-sheet .dn-detail-table th,.dn-sheet .dn-detail-table td{white-space:normal;overflow-wrap:anywhere;padding:4px 2px;font-size:9px;line-height:1.3;}
  .dn-header{gap:10px;}
  .dn-logo{height:28px;}
  .dn-sheet h2{font-size:16px;}
}
@page{size:A4 portrait;margin:0;}
@media print{
  html,body{width:210mm;min-width:210mm;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  header.topbar,nav.tabs,.sub-tabs,.dn-actions,.toolbar{display:none !important;}
  .dn-sheet{width:210mm !important;min-width:210mm !important;max-width:210mm !important;border:none;box-shadow:none;padding:14mm 7mm !important;overflow:visible !important;}
  .dn-header{display:grid !important;grid-template-columns:42mm 1fr 42mm !important;align-items:center !important;gap:0 !important;margin-bottom:9mm !important;}
  .dn-header::after{content:'';grid-column:3;}
  .dn-header .dn-logo{grid-column:1;}
  .dn-header h2{grid-column:2;}
  .dn-header h2{font-size:22pt !important;}
  .dn-logo{height:14mm !important;}
  .dn-grid{display:grid !important;grid-template-columns:minmax(0,1.65fr) minmax(42mm,.65fr) !important;gap:0 10mm !important;margin-bottom:8mm !important;}
  .dn-grid .block{font-size:12pt !important;line-height:1.8 !important;}
  .dn-grid .block:first-child{white-space:nowrap;}
  .dn-grid .block.dn-right,.dn-grid .block.dn-right b{text-align:right !important;}
  .dn-grid .block.dn-right .dn-field{margin-left:auto !important;text-align:right !important;}
  .dn-table-wrap{overflow:visible !important;margin-bottom:5mm !important;}
  .dn-sheet .dn-table{min-width:0 !important;table-layout:fixed !important;}
  .dn-sheet .dn-table th,.dn-sheet .dn-table td{white-space:normal !important;overflow-wrap:anywhere !important;font-size:10pt !important;padding:2.5mm 2mm !important;}
  main{padding:0;max-width:none;}
}
/* PDF 下載使用固定 A4 可列印寬度，不受目前手機螢幕寬度或表格捲動設定影響。 */
body.pdf-export .dn-sheet{width:733px;max-width:733px;min-width:733px;padding:32px 40px;border:none;border-radius:0;box-shadow:none;overflow:visible;font-size:14px;}
body.pdf-export .dn-table-wrap{overflow:visible;}
body.pdf-export .dn-table{min-width:0;table-layout:fixed;}

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="name">Eaton 蘆竹 UPS 倉儲管理系統</div>
      <div class="sub">Morrison Express｜庫存進出貨與請款作業</div>
    </div>
    <nav class="tabs">
      <button data-tab="inventory" class="active">庫存管理</button>
      <button data-tab="billing">請款單</button>
      <button data-tab="putaway">上架作業</button>
      <button data-tab="outbound">出貨作業</button>
      <button data-tab="settings">費率設定</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   State
========================================================= */
let records = [];
let settings = {
  freeAllowancePallets: 300,
  rentRatePerPalletDay: 10,
  inboundFeePerPallet: 200,
  outboundFeePerPallet: 200,
  forkliftFeePerPallet: 0,
  loadContainerFee: 9500,
  unloadContainerFee: 7000,
  overtimeWeekdayRate: 1500,
  overtimeHolidayRate: 3000,
  taxRate: 5,
  applyTax: false
};
let activeTab = 'inventory';
let invFilter = { q:'', status:'all' };
let billingPeriod = { start:'', end:'' };
let billingRows = null; // computed rows cache

let putawayItems = [];
let putawaySubTab = 'create';
let draftRows = [{sku:'',qty:'',pallets:''}];
let draftDate = '';
let currentBatchId = null;
let currentItemId = null;
const PUTAWAY_SCAN_STORAGE_KEY = 'eaton-putaway-scan-draft-v1';
let putawayScanDraft = loadPutawayScanDraft(); // 本次掃描暫存；確認整批上架前不寫入資料庫

let shipments = [];
let outboundSubTab = 'create';
let outboundDraft = null;
let printShipmentId = null;
let locationCameraScanner = null;

/* =========================================================
   Persistence — Firebase Firestore (雲端資料庫，支援多裝置即時同步)
   ---------------------------------------------------------
   請將下面 firebaseConfig 換成您自己 Firebase 專案的設定值。
   取得方式請見部署說明。設定完成前，網頁會顯示設定教學畫面。
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyC-qZGEEhqUSPkbCL0xCcR5VM2IHt7JjrY",
  authDomain: "eaton-wms.firebaseapp.com",
  projectId: "eaton-wms",
  storageBucket: "eaton-wms.firebasestorage.app",
  messagingSenderId: "492510737199",
  appId: "1:492510737199:web:74ceaace8133576e3627da"
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY';

let db = null;
let firebaseReady = false;
if(FIREBASE_CONFIGURED){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }catch(e){ console.error('Firebase 初始化失敗', e); }
}

function sameJSON(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }

async function loadState(){
  if(!firebaseReady) return; // 未設定 Firebase，交由 init() 顯示設定畫面
  try{
    const snap = await db.collection('appdata').doc('inventory-records').get();
    records = snap.exists ? (snap.data().value||[]) : [];
  }catch(e){ records = []; showToast('讀取庫存資料失敗，請檢查網路'); }
  try{
    const snap = await db.collection('appdata').doc('billing-settings').get();
    if(snap.exists) settings = Object.assign(settings, snap.data().value||{});
  }catch(e){ /* keep defaults */ }
  try{
    const snap = await db.collection('appdata').doc('putaway-items').get();
    putawayItems = snap.exists ? (snap.data().value||[]) : [];
  }catch(e){ putawayItems = []; }
  try{
    const snap = await db.collection('appdata').doc('shipments').get();
    shipments = snap.exists ? (snap.data().value||[]) : [];
  }catch(e){ shipments = []; }

  // 即時監聽：其他裝置（例如手機掃描）寫入後，這裡會自動收到更新並重繪畫面
  db.collection('appdata').doc('inventory-records').onSnapshot(doc=>{
    if(!doc.exists) return;
    const val = doc.data().value||[];
    if(sameJSON(val, records)) return;
    records = val;
    if(activeTab==='inventory'||activeTab==='billing') render();
  });
  db.collection('appdata').doc('putaway-items').onSnapshot(doc=>{
    if(!doc.exists) return;
    const val = doc.data().value||[];
    if(sameJSON(val, putawayItems)) return;
    putawayItems = val;
    if(activeTab==='putaway') render();
  });
  db.collection('appdata').doc('shipments').onSnapshot(doc=>{
    if(!doc.exists) return;
    const val = doc.data().value||[];
    if(sameJSON(val, shipments)) return;
    shipments = val;
    if(activeTab==='outbound') render();
  });
  db.collection('appdata').doc('billing-settings').onSnapshot(doc=>{
    if(!doc.exists) return;
    const val = doc.data().value||{};
    if(sameJSON(val, settings)) return;
    settings = Object.assign(settings, val);
    if(activeTab==='settings'||activeTab==='billing') render();
  });
}
async function saveRecords(){
  if(!firebaseReady) return;
  try{ await db.collection('appdata').doc('inventory-records').set({value:records}); }
  catch(e){ showToast('儲存失敗，請檢查網路連線'); }
}
async function saveSettings(){
  if(!firebaseReady) return;
  try{ await db.collection('appdata').doc('billing-settings').set({value:settings}); }
  catch(e){ showToast('設定儲存失敗'); }
}
async function savePutaway(){
  if(!firebaseReady) return;
  try{ await db.collection('appdata').doc('putaway-items').set({value:putawayItems}); }
  catch(e){ showToast('上架資料儲存失敗，請重試'); }
}
async function saveShipments(){
  if(!firebaseReady) return;
  try{ await db.collection('appdata').doc('shipments').set({value:shipments}); }
  catch(e){ showToast('出貨單儲存失敗，請重試'); }
}

/* =========================================================
   Utils
========================================================= */
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function displayDate(value){ return String(value||'').replaceAll('-','/'); }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
// ExcelJS 以 UTC 序號寫入 Date；使用 UTC 正午避免台灣時區在午夜被換算成前一天。
function parseExcelDate(s){
  if(!s) return null;
  const [y,m,d] = String(s).replaceAll('/','-').split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d,12,0,0));
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtMoney(n){ return 'NT$'+Math.round(n||0).toLocaleString('zh-Hant'); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function statusOf(rec){
  return rec.outboundDate ? 'shipped' : 'instock';
}
function isAbnormal(rec){
  return !!(rec.note||'').includes('異常');
}

/* =========================================================
   Render root
========================================================= */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===activeTab);
  });
  const main = document.getElementById('main');
  if(activeTab==='inventory') main.innerHTML = renderInventory();
  else if(activeTab==='billing') main.innerHTML = renderBilling();
  else if(activeTab==='putaway') main.innerHTML = renderPutaway();
  else if(activeTab==='outbound') main.innerHTML = renderOutbound();
  else main.innerHTML = renderSettings();
  attachHandlers();
  if(activeTab==='putaway' && putawaySubTab==='scan'){
    const inp = document.getElementById('pw-scan-input');
    if(inp) inp.focus();
  }
}

// 主選單再次點擊時，回復該頁第一次進入時的操作畫面；已儲存的資料不受影響。
function resetTabView(tab){
  if(tab==='inventory'){
    invFilter = {q:'',status:'all'};
  }else if(tab==='billing'){
    billingPeriod = {start:'',end:''};
    billingRows = null;
  }else if(tab==='putaway'){
    putawaySubTab = 'create';
    draftRows = [{sku:'',qty:'',pallets:''}];
    draftDate = '';
    currentBatchId = null;
    currentItemId = null;
  }else if(tab==='outbound'){
    outboundSubTab = 'create';
    outboundDraft = null;
    printShipmentId = null;
  }
}

function loadPutawayScanDraft(){
  try{ return JSON.parse(localStorage.getItem(PUTAWAY_SCAN_STORAGE_KEY)||'{}')||{}; }
  catch(e){ return {}; }
}

function savePutawayScanDraft(){
  try{ localStorage.setItem(PUTAWAY_SCAN_STORAGE_KEY,JSON.stringify(putawayScanDraft)); }
  catch(e){}
}

function clearPutawayScanDraftForBatch(batchId){
  const batch = batchesFromItems().find(b=>b.batchId===batchId);
  if(batch) batch.items.forEach(item=>delete putawayScanDraft[item.id]);
  savePutawayScanDraft();
}

/* =========================================================
   INVENTORY TAB
========================================================= */
function filteredRecords(){
  return records.filter(r=>{
    if(invFilter.status==='instock' && statusOf(r)!=='instock') return false;
    if(invFilter.status==='shipped' && statusOf(r)!=='shipped') return false;
    if(invFilter.status==='alert' && !isAbnormal(r)) return false;
    if(invFilter.q){
      const q = invFilter.q.toLowerCase();
      const hay = [r.sku,r.location,r.containerNo,r.note].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.inboundDate||'').localeCompare(a.inboundDate||''));
}

function renderInventory(){
  const list = filteredRecords();
  const inStock = records.filter(r=>statusOf(r)==='instock');
  const totalPalletsInStock = inStock.reduce((s,r)=>s+(Number(r.pallets)||0),0);
  const skuCount = new Set(inStock.map(r=>r.sku)).size;
  const totalInboundPallets = records.reduce((s,r)=>s+(Number(r.pallets)||0),0);
  const abnormalPallets = records.filter(r=>isAbnormal(r)).reduce((s,r)=>s+(Number(r.pallets)||0),0);
  const shippedPallets = records.filter(r=>statusOf(r)==='shipped').reduce((s,r)=>s+(Number(r.pallets)||0),0);

  return `
  <div class="stat-row">
    <div class="stat-card"><div class="label">在庫棧板數</div><div class="value accent">${totalPalletsInStock}</div></div>
    <div class="stat-card"><div class="label">在庫 SKU 種類</div><div class="value">${skuCount}</div></div>
    <div class="stat-card"><div class="label">總進貨棧板數</div><div class="value">${totalInboundPallets}</div></div>
    <div class="stat-card"><div class="label">已出貨棧板數</div><div class="value">${shippedPallets}</div></div>
    <div class="stat-card"><div class="label">異常板數</div><div class="value ${abnormalPallets?'warn':''}">${abnormalPallets}</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="inv-search" placeholder="搜尋 SKU / 儲位 / 櫃號 / 備註" value="${esc(invFilter.q)}" style="width:230px;">
    <select id="inv-status">
      <option value="all" ${invFilter.status==='all'?'selected':''}>全部狀態</option>
      <option value="instock" ${invFilter.status==='instock'?'selected':''}>在庫</option>
      <option value="shipped" ${invFilter.status==='shipped'?'selected':''}>已出貨</option>
      <option value="alert" ${invFilter.status==='alert'?'selected':''}>異常</option>
    </select>
    <div class="spacer"></div>
    <input type="file" id="import-file" accept=".xlsx,.xls,.xlsm,.csv" class="file-input-hidden">
    <button class="btn" id="btn-import">匯入 Excel</button>
    <button class="btn" id="btn-export-inv">匯出 Excel</button>
    <button class="btn btn-primary" id="btn-add">＋ 新增庫存</button>
  </div>

  <div class="table-wrap">
  <table>
    <thead><tr>
      <th>進倉日期</th><th>SKU 物料</th><th>數量</th><th>棧板數</th><th>儲位</th><th>櫃號</th>
      <th>出貨日期</th><th>備註</th><th>狀態</th><th>操作</th>
    </tr></thead>
    <tbody>
    ${list.length===0 ? `<tr><td colspan="10"><div class="empty-state"><div class="big">目前沒有符合條件的庫存資料</div>試著調整篩選條件，或點選「新增庫存」建立第一筆資料。</div></td></tr>` :
      list.map(r=>{
        const st = statusOf(r);
        const abn = isAbnormal(r);
        const statusBadge = st==='instock' ? '<span class="badge badge-instock">在庫</span>' : '<span class="badge badge-shipped">已出貨</span>';
        const abnormalBadge = abn ? ' <span class="badge badge-alert">異常</span>' : '';
        const rowClasses = [st==='shipped'?'row-shipped':'', abn?'row-abnormal':''].filter(Boolean).join(' ');
        return `<tr class="${rowClasses}" data-id="${r.id}">
          <td class="mono">${esc(displayDate(r.inboundDate))}</td>
          <td class="sku-cell">${esc(r.sku)}</td>
          <td class="num">${esc(r.qty)}</td>
          <td class="num">${esc(r.pallets)}</td>
          <td class="mono">${esc(r.location)}</td>
          <td class="mono">${esc(r.containerNo)}</td>
          <td class="mono">${esc(r.outboundDate)||'—'}</td>
          <td>${esc(r.note)}</td>
          <td>${statusBadge}${abnormalBadge}</td>
          <td class="actions-cell">
            <button class="btn btn-sm" data-act="edit" data-id="${r.id}">編輯</button>
            ${st!=='shipped' ? `<button class="btn btn-sm" data-act="ship" data-id="${r.id}">標記出貨</button>` : `<button class="btn btn-sm" data-act="unship" data-id="${r.id}">取消出貨</button>`}
            <button class="btn btn-sm btn-danger" data-act="del" data-id="${r.id}">刪除</button>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>
  </div>
  `;
}

/* Add/Edit Modal */
function openRecordModal(rec){
  const isEdit = !!rec;
  const r = rec || {id:'', inboundDate:'', qty:'', pallets:'', sku:'', location:'', containerNo:'', outboundDate:'', note:''};
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'record-overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>${isEdit?'編輯庫存資料':'新增庫存資料'}</h3>
      <div class="form-grid">
        <label>進倉日期<input type="date" id="f-inboundDate" value="${esc(r.inboundDate)}"></label>
        <label>出貨日期<input type="date" id="f-outboundDate" value="${esc(r.outboundDate)}"></label>
        <label>SKU 物料<input type="text" id="f-sku" value="${esc(r.sku)}"></label>
        <label>儲位<input type="text" id="f-location" value="${esc(r.location)}"></label>
        <label>數量 (組數/PCS)<input type="number" id="f-qty" value="${esc(r.qty)}"></label>
        <label>棧板數<input type="number" id="f-pallets" value="${esc(r.pallets)}"></label>
        <label>櫃號<input type="text" id="f-containerNo" value="${esc(r.containerNo)}"></label>
        <label class="full">備註<input type="text" id="f-note" value="${esc(r.note)}" placeholder="例如：異常、#0814*28板"></label>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">${isEdit?'儲存變更':'新增'}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  document.getElementById('modal-cancel').onclick = ()=>wrap.remove();
  wrap.addEventListener('click', e=>{ if(e.target===wrap) wrap.remove(); });
  document.getElementById('modal-save').onclick = async ()=>{
    const sku = document.getElementById('f-sku').value.trim();
    const inboundDate = document.getElementById('f-inboundDate').value;
    if(!sku || !inboundDate){ showToast('請至少填寫 SKU 與進倉日期'); return; }
    const data = {
      id: isEdit ? r.id : uid(),
      inboundDate,
      outboundDate: document.getElementById('f-outboundDate').value || null,
      sku,
      location: document.getElementById('f-location').value.trim(),
      qty: document.getElementById('f-qty').value,
      pallets: document.getElementById('f-pallets').value,
      containerNo: document.getElementById('f-containerNo').value.trim(),
      note: document.getElementById('f-note').value.trim(),
      overtimeWeekdayHours: r.overtimeWeekdayHours||0,
      overtimeHolidayHours: r.overtimeHolidayHours||0,
      loadContainer: r.loadContainer||false,
      unloadContainer: r.unloadContainer||false,
      adjustAmount: r.adjustAmount||0
    };
    if(isEdit){
      const idx = records.findIndex(x=>x.id===r.id);
      records[idx] = data;
    } else {
      records.push(data);
    }
    await saveRecords();
    wrap.remove();
    render();
    showToast(isEdit?'已儲存變更':'已新增庫存資料');
  };
}

/* Excel Import */
function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      // find header row
      let headerIdx = -1, colMap = {};
      for(let i=0;i<Math.min(rows.length,15);i++){
        const row = rows[i].map(c=>String(c).trim());
        if(row.some(c=>c.includes('SKU')||c.includes('物料'))){
          headerIdx = i;
          row.forEach((c,ci)=>{
            if(c.includes('Inbound')||c.includes('進倉')) colMap.inboundDate=ci;
            else if(c.includes('Outbound')||c.includes('出倉')||c.includes('出貨')) colMap.outboundDate=ci;
            else if(c.includes('Pallet')||c.includes('棧板')) colMap.pallets=ci;
            else if(c.includes('QTY')||c.includes('PCS')||c.includes('數量')) colMap.qty=ci;
            else if(c.includes('SKU')||c.includes('物料')) colMap.sku=ci;
            else if(c.includes('儲位')) colMap.location=ci;
            else if(c.includes('櫃號')) colMap.containerNo=ci;
            else if(c.includes('備註')) colMap.note=ci;
          });
          break;
        }
      }
      if(headerIdx===-1 || colMap.sku===undefined){
        showToast('找不到 SKU 欄位，請確認 Excel 格式'); return;
      }
      const dateToISO = (v)=>{
        if(!v) return '';
        if(v instanceof Date) return toISO(v);
        return String(v).trim();
      };
      let added = 0;
      for(let i=headerIdx+1;i<rows.length;i++){
        const row = rows[i];
        const sku = row[colMap.sku];
        if(!sku || String(sku).trim()==='') continue;
        records.push({
          id: uid(),
          inboundDate: dateToISO(row[colMap.inboundDate]),
          outboundDate: colMap.outboundDate!==undefined ? (dateToISO(row[colMap.outboundDate])||null) : null,
          sku: String(sku).trim(),
          location: colMap.location!==undefined ? String(row[colMap.location]||'').trim() : '',
          qty: colMap.qty!==undefined ? row[colMap.qty] : '',
          pallets: colMap.pallets!==undefined ? row[colMap.pallets] : 1,
          containerNo: colMap.containerNo!==undefined ? String(row[colMap.containerNo]||'').trim() : '',
          note: colMap.note!==undefined ? String(row[colMap.note]||'').trim() : '',
          overtimeWeekdayHours:0, overtimeHolidayHours:0, loadContainer:false, unloadContainer:false, adjustAmount:0
        });
        added++;
      }
      await saveRecords();
      render();
      showToast(`已匯入 ${added} 筆庫存資料`);
    }catch(err){
      showToast('匯入失敗：檔案格式無法解析');
    }
  };
  reader.readAsArrayBuffer(file);
}

async function exportInventory(){
  const rows = filteredRecords().sort((a,b)=>{
    const aShipped = statusOf(a)==='shipped';
    const bShipped = statusOf(b)==='shipped';
    // 已出貨資料置頂，並以入倉日由早到晚排列；同日再按 SKU、儲位排序。
    if(aShipped !== bShipped) return aShipped ? -1 : 1;
    if(aShipped){
      return (a.inboundDate||'').localeCompare(b.inboundDate||'')
        || String(a.sku||'').localeCompare(String(b.sku||''),undefined,{numeric:true})
        || String(a.location||'').localeCompare(String(b.location||''),undefined,{numeric:true});
    }
    return (b.inboundDate||'').localeCompare(a.inboundDate||'');
  });
  const reportMonth = displayDate(toISO(new Date())).slice(0,7);
  if(typeof ExcelJS==='undefined'){
    showToast('Excel 匯出元件尚未載入，請確認網路後重試');
    return;
  }
  const workbook = new ExcelJS.Workbook();
  const ws = workbook.addWorksheet('Inventory', {views:[{state:'frozen',ySplit:2}]});
  // ExcelJS 的預設字型字寬比範本的「新細明體」窄；依實際 100% 顯示
  // 補償後的欄寬輸出，讓 Excel 視覺寬度與範本一致，並保留 yyyy/mm/dd。
  ws.columns = [
    {width:21.1},{width:20.625},{width:12.5},{width:37.5},
    {width:37.5},{width:25},{width:18.75},{width:43.125}
  ];
  // 白色、背景 1、較深 25%：套用至所有資料與表頭框線。
  const thinGray = {style:'thin',color:{argb:'FFBFBFBF'}};
  const allBorders = {top:thinGray,bottom:thinGray,left:thinGray,right:thinGray};
  // Office 佈景主題色彩：藍色輔色 1（較深 25%）與輔色 5（較淺 60%）。
  const titleColor = 'FF2F5597';
  const headerFill = 'FFBDD7EE';
  const inboundFill = 'FFF2F2F2';
  const pendingDetailFill = 'FFD9E2F3';
  const shippedFill = 'FFBFBFBF';
  const bodyTextColor = 'FF44546A';
  ws.getRow(1).height = 70;
  ws.getRow(2).height = 45.25;
  // 第一列維持整列白底；跨欄後不會露出工作表格線。
  for(let col=1;col<=8;col++){
    const cell = ws.getCell(1,col);
    cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFFFF'}};
    cell.border = {};
  }
  ws.mergeCells('B1:H1');
  ws.getCell('B1').value = `EATON 蘆竹 UPS Inventory Report       ${reportMonth}`;
  ws.getCell('B1').font = {name:'Calibri',size:20,bold:true,color:{argb:titleColor}};
  ws.getCell('B1').alignment = {horizontal:'center',vertical:'middle'};
  const logoId = workbook.addImage({base64:INVENTORY_EXPORT_LOGO,extension:'png'});
  // Logo 固定為 1.91 × 0.81 吋，並向右微調以對齊範本內容起點。
  ws.addImage(logoId, {
    tl:{col:0.27,row:0.111},
    ext:{width:183.36,height:77.76}
  });
  const headers = ['Inbound\nDate','QTY (Groups)\nPCS','Pallet\n棧板數','SKU 物料','儲位','櫃號','Outbound\nDate','備註'];
  headers.forEach((label,index)=>{
    const cell = ws.getCell(2,index+1);
    cell.value = label;
    cell.font = {name:'Calibri',size:15,bold:true,color:{argb:'FF000000'}};
    cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:headerFill}};
    cell.alignment = {horizontal:'center',vertical:'middle',wrapText:true};
    cell.border = allBorders;
  });
  rows.forEach((record,index)=>{
    const rowNumber = index+3;
    const row = ws.getRow(rowNumber);
    row.height = 20;
    row.values = [
      parseExcelDate(record.inboundDate)||null,
      Number(record.qty)||0,
      Number(record.pallets)||0,
      record.sku||'',
      record.location||'',
      record.containerNo||'',
      record.outboundDate ? (parseExcelDate(record.outboundDate)||null) : null,
      record.note||''
    ];
    const isShipped = statusOf(record)==='shipped';
    for(let col=1;col<=8;col++){
      const cell = ws.getCell(rowNumber,col);
      cell.font = {name:'Calibri',size:15,color:{argb:bodyTextColor}};
      cell.alignment = {horizontal:'center',vertical:'middle'};
      // 範本中已出貨資料為純灰底，不顯示儲存格框線。
      cell.border = isShipped ? {} : allBorders;
      const fill = isShipped
        ? shippedFill
        : (col <= 5 ? inboundFill : pendingDetailFill);
      cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
    }
    ws.getCell(rowNumber,1).numFmt = 'yyyy/mm/dd';
    ws.getCell(rowNumber,2).numFmt = '#,##0';
    ws.getCell(rowNumber,3).numFmt = '#,##0';
    ws.getCell(rowNumber,7).numFmt = 'yyyy/mm/dd';
  });
  ws.autoFilter = {from:'A2',to:`H${Math.max(2,rows.length+2)}`};
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'EATON - Inventory Report_蘆竹倉.xlsx';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function batchesFromItems(){
  const map = {};
  putawayItems.forEach(it=>{
    if(!map[it.batchId]) map[it.batchId] = {batchId:it.batchId, batchDate:it.batchDate, items:[]};
    map[it.batchId].items.push(it);
  });
  return Object.values(map)
    .map(b=>{
      b.items.sort((a,c)=>a.seq-c.seq);
      b.total = b.items.length;
      b.done = b.items.filter(i=>i.status==='done').length;
      return b;
    })
    .sort((a,b)=> b.batchDate.localeCompare(a.batchDate) || b.batchId.localeCompare(a.batchId));
}

function renderPutawayScan(){
  const batches = batchesFromItems();
  if(batches.length===0){
    return `<div class="table-wrap"><div class="empty-state"><div class="big">尚未建立任何上架清單</div>請先切換到「建立上架清單」新增批次。</div></div>`;
  }
  const openBatches = batches.filter(b=>b.done<b.total);
  if(openBatches.length===0){
    return `<div class="done-banner">目前沒有待上架批次。<br><button class="btn btn-primary" id="btn-go-putaway-create">建立上架清單</button></div>`;
  }
  if(!currentBatchId || !openBatches.find(b=>b.batchId===currentBatchId)){
    currentBatchId = openBatches[0].batchId;
  }
  const batch = batches.find(b=>b.batchId===currentBatchId);
  const items = batch.items;
  let current = currentItemId ? items.find(i=>i.id===currentItemId) : null;
  if(!current) current = items.find(i=>i.status==='pending' && !(putawayScanDraft[i.id]?.location || i.location)) || null;
  const pendingItems = items.filter(i=>i.status==='pending');
  const scannedCount = pendingItems.filter(i=>putawayScanDraft[i.id]?.location || i.location).length;

  const selectHtml = `<select id="pw-batch-select">
    ${openBatches.map(b=>`<option value="${b.batchId}" ${b.batchId===currentBatchId?'selected':''}>${esc(displayDate(b.batchDate))}（已上架 ${b.done}/${b.total}）</option>`).join('')}
  </select>`;

  const allPendingScanned = pendingItems.length>0 && scannedCount===pendingItems.length;
  const currentHtml = pendingItems.length===0 ? `<div class="done-banner">🎉 本批次共 ${batch.total} 板已全部上架完成</div>` : allPendingScanned ? `
    <div class="done-banner putaway-ready-banner">已掃描 ${scannedCount} / ${pendingItems.length} 板，請確認後一次完成上架。<br><button class="btn btn-primary" id="btn-finalize-putaway">確認上架</button></div>
  ` : !current ? `
    <div class="done-banner putaway-ready-banner">已掃描 ${scannedCount} / ${pendingItems.length} 板，請確認後一次完成上架。<br><button class="btn btn-primary" id="btn-finalize-putaway">確認上架</button></div>
  ` : `
    <div class="current-card">
      <div class="meta">目前作業　棧板 <b>No.${current.seq}</b> ／ 共 ${batch.total} 板（已暫存 ${scannedCount}/${pendingItems.length} 板）</div>
      <div class="meta">SKU <b>${esc(current.sku)}</b>　入倉日 <b>${esc(displayDate(current.batchDate))}</b>　數量 <b>${esc(current.qty)}</b></div>
      <div class="scan-row">
        <input type="text" id="pw-scan-input" placeholder="掃描或輸入儲位後按 Enter" autocomplete="off">
        <button class="btn btn-camera" id="btn-open-location-camera" type="button" aria-label="使用相機掃描儲位條碼">📷 相機掃描</button>
        <input type="text" id="pw-scan-abnormal" placeholder="異常註記（選填）" autocomplete="off">
        <button class="btn btn-primary" id="pw-confirm-btn">暫存此板</button>
      </div>
    </div>
  `;

  const listHtml = `
  <div class="pallet-cards">
  ${items.map(it=>{
    const staged = putawayScanDraft[it.id]||{};
    const location = staged.location ?? it.location;
    const abnormalText = staged.abnormalText ?? it.abnormalText;
    const isStaged = it.status==='pending' && !!location;
    const isAbnormal = !!abnormalText;
    const cls = ['pallet-card', it.status==='done'?'is-done':'is-pending', it.id===(current&&current.id)?'is-current':'', isAbnormal?'is-abnormal':''].join(' ');
    return `<div class="${cls}" data-item-id="${it.id}">
      <div class="pinfo"><b>No.${it.seq}</b> ${esc(it.sku)}<br>數量 ${esc(it.qty)}</div>
      <input type="text" class="ploc ${it.status==='pending'?'pending-bg':''}" placeholder="儲位" data-pfield="location" data-item-id="${it.id}" value="${esc(location)}">
      <input type="text" class="pabn ${isAbnormal?'has-text':''}" placeholder="異常註記" data-pfield="abnormalText" data-item-id="${it.id}" value="${esc(abnormalText)}">
      <span class="pstatus ${it.status==='done'?'done':isStaged?'staged':'pending'}">${it.status==='done'?'已上架':isStaged?'已暫存':'待掃描'}</span>
      ${it.id!==(current&&current.id) ? `<button class="jump-link" data-act="jump-item" data-item-id="${it.id}">設為目前作業</button>` : ''}
    </div>`;
  }).join('')}
  </div>`;

  return `
  <div class="toolbar">${selectHtml}</div>
  ${currentHtml}
  ${listHtml}
  `;
}

async function stopLocationCameraScan(){
  const scanner = locationCameraScanner;
  locationCameraScanner = null;
  if(scanner){
    try{ await scanner.stop(); }catch(e){}
    try{ await scanner.clear(); }catch(e){}
  }
  document.getElementById('location-camera-overlay')?.remove();
}

async function startLocationCameraScan(){
  if(typeof Html5Qrcode==='undefined'){
    showToast('條碼掃描元件尚未載入，請確認網路連線後重試');
    return;
  }
  if(!window.isSecureContext && location.hostname!=='localhost'){
    showToast('相機掃描需透過 HTTPS 網址開啟網頁');
    return;
  }
  await stopLocationCameraScan();
  document.body.insertAdjacentHTML('beforeend',`
    <div class="overlay" id="location-camera-overlay" role="dialog" aria-modal="true">
      <div class="camera-scanner">
        <h3>掃描儲位條碼</h3>
        <div id="location-camera-reader"></div>
        <div class="hint">請將儲位條碼置於鏡頭中央。掃描成功後會自動帶入儲位欄位。</div>
        <div class="modal-actions"><button class="btn" id="btn-close-location-camera" type="button">取消</button></div>
      </div>
    </div>`);
  document.getElementById('btn-close-location-camera').onclick = stopLocationCameraScan;
  try{
    const scanner = new Html5Qrcode('location-camera-reader');
    locationCameraScanner = scanner;
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:280,height:160},aspectRatio:1.75},
      decodedText=>{
        const abnormalInput = document.getElementById('pw-scan-abnormal');
        stopLocationCameraScan();
        stagePutaway(decodedText.trim(), abnormalInput?.value||'');
      },
      ()=>{}
    );
  }catch(e){
    await stopLocationCameraScan();
    showToast('無法開啟相機，請允許相機權限後重試');
  }
}

function computeQtySplit(total, pallets){
  const base = Math.floor(total/pallets), rem = total - base*pallets;
  const arr = [];
  for(let i=0;i<pallets;i++) arr.push(i<rem ? base+1 : base);
  return arr;
}

function buildBatchFromRows(dateVal, rows){
  const cleanRows = rows.filter(r=>r.sku && String(r.sku).trim() && Number(r.qty)>0 && Number(r.pallets)>0);
  if(cleanRows.length===0) return null;
  const batchId = 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const totalPallets = cleanRows.reduce((s,r)=>s+Number(r.pallets),0);
  const d = parseISO(dateVal);
  if(!d) return null;
  const batchNote = `#${pad(d.getMonth()+1)}${pad(d.getDate())}*${totalPallets}板`;
  let seq = 1, isFirst = true;
  cleanRows.forEach(r=>{
    const split = computeQtySplit(Number(r.qty), Number(r.pallets));
    split.forEach(qty=>{
      putawayItems.push({
        id: uid(), batchId, batchDate: dateVal, seq: seq++, sku: String(r.sku).trim(),
        qty, pallets:1, location:'', status:'pending', abnormalText:'',
        isFirstOfBatch:isFirst, batchNote, invRecordId:null
      });
      isFirst = false;
    });
  });
  return { batchId, count: seq-1 };
}

async function createPutawayBatch(){
  const dateVal = document.getElementById('pw-date').value;
  if(!dateVal){ showToast('請選擇入倉日'); return; }
  const result = buildBatchFromRows(dateVal, draftRows);
  if(!result){ showToast('請至少填寫一筆完整的料號／數量／板數'); return; }
  await savePutaway();
  draftRows = [{sku:'',qty:'',pallets:''}];
  currentBatchId = result.batchId;
  currentItemId = null;
  putawaySubTab = 'scan';
  render();
  showToast(`已產生上架清單，共 ${result.count} 板`);
}

function normalizePutawayDate(v){
  if(v===undefined || v===null || v==='') return '';
  if(v instanceof Date) return toISO(v);
  const s = String(v).trim();
  const m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m) return `${m[1]}-${pad(Number(m[2]))}-${pad(Number(m[3]))}`;
  return s;
}

/* Generic parser for 入倉/出倉紀錄表 style sheets: 日期 / 料號 / 數量(組) / 板數 */
function parseWarehouseSheetRows(rows){
  let headerIdx = -1, col = {};
  for(let i=0;i<Math.min(rows.length,15);i++){
    const row = rows[i].map(c=>String(c).trim());
    if(row.some(c=>c.includes('料號')) && row.some(c=>c.includes('板數'))){
      headerIdx = i;
      row.forEach((c,ci)=>{
        if(c.includes('倉日')) col.date = ci;
        else if(c.includes('料號')) col.sku = ci;
        else if(c.includes('數量')) col.qty = ci;
        else if(c.includes('板數')) col.pallets = ci;
      });
      break;
    }
  }
  if(headerIdx===-1 || col.sku===undefined || col.pallets===undefined) return null;
  let lastDate = '';
  const grouped = {};
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i];
    if(col.date!==undefined && row[col.date]!==''){
      const nd = normalizePutawayDate(row[col.date]);
      if(nd) lastDate = nd;
    }
    const sku = row[col.sku];
    if(!sku || String(sku).trim()==='') continue;
    if(!lastDate) continue;
    const qty = col.qty!==undefined ? row[col.qty] : '';
    const pallets = row[col.pallets];
    if(!grouped[lastDate]) grouped[lastDate] = [];
    grouped[lastDate].push({sku:String(sku).trim(), qty, pallets});
  }
  return grouped;
}

/* Scan every sheet in the workbook, merge all date-grouped rows found,
   and return only the rows for the single most recent date (客戶常常一個檔案裡有多個分頁/舊資料，只取最新日期那批) */
function parseWorkbookLatestDate(wb){
  const merged = {};
  wb.SheetNames.forEach(name=>{
    const sheet = wb.Sheets[name];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    const grouped = parseWarehouseSheetRows(rows);
    if(!grouped) return;
    Object.keys(grouped).forEach(dt=>{
      if(!merged[dt]) merged[dt] = [];
      merged[dt] = merged[dt].concat(grouped[dt]);
    });
  });
  const dates = Object.keys(merged).sort(); // ISO date strings sort chronologically
  if(dates.length===0) return null;
  const latest = dates[dates.length-1];
  return { date: latest, rows: merged[latest], allDates: dates };
}

function handlePutawayImportFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const result = parseWorkbookLatestDate(wb);
      if(!result){
        showToast('找不到「料號」或「板數」欄位，請確認 Excel 格式'); return;
      }
      const built = buildBatchFromRows(result.date, result.rows);
      if(!built){ showToast('資料格式無法解析為有效批次'); return; }
      await savePutaway();
      currentBatchId = built.batchId;
      currentItemId = null;
      putawaySubTab = 'scan';
      render();
      const multiNote = result.allDates.length>1 ? `（偵測到 ${result.allDates.length} 個日期，已取最新的 ${result.date}）` : '';
      showToast(`已匯入 ${built.count} 板 ${multiNote}`);
    }catch(err){
      showToast('匯入失敗：檔案格式無法解析');
    }
  };
  reader.readAsArrayBuffer(file);
}

function syncInventoryForItem(item){
  const note = [item.isFirstOfBatch ? item.batchNote : '', item.abnormalText || ''].filter(Boolean).join(' ');
  if(item.invRecordId){
    const rec = records.find(r=>r.id===item.invRecordId);
    if(rec){ rec.location = item.location; rec.note = note; return; }
  }
  const rec = {
    id: uid(), inboundDate: item.batchDate, outboundDate:null, sku:item.sku,
    location:item.location, qty:item.qty, pallets:item.pallets, containerNo:'', note,
    overtimeWeekdayHours:0, overtimeHolidayHours:0, loadContainer:false, unloadContainer:false, adjustAmount:0
  };
  records.push(rec);
  item.invRecordId = rec.id;
}

function currentPendingPutawayItem(){
  const batches = batchesFromItems();
  const batch = batches.find(b=>b.batchId===currentBatchId);
  if(!batch) return null;
  let current = currentItemId ? batch.items.find(i=>i.id===currentItemId) : null;
  if(!current) current = batch.items.find(i=>i.status==='pending' && !(putawayScanDraft[i.id]?.location || i.location));
  return current || null;
}

function normalizeLocationCode(value){
  return String(value||'').trim().toUpperCase();
}

function isValidLocationCode(value){
  // 格式：兩個英文字母 + 兩位數字 + 一個大寫英文字母 + 一位數字，例如 AW00A1。
  return /^[A-Z]{2}\d{2}[A-Z]\d$/.test(value);
}

function stagePutaway(locationVal, abnormalVal){
  const current = currentPendingPutawayItem();
  if(!current) return;
  const location = normalizeLocationCode(locationVal);
  if(!location){ showToast('請輸入或掃描儲位'); return; }
  if(!isValidLocationCode(location)){ showToast('儲位格式錯誤，請使用例如 AW00A1 或 BE12B2'); return; }
  putawayScanDraft[current.id] = {location,abnormalText:(abnormalVal||'').trim()};
  savePutawayScanDraft();
  currentItemId = null;
  render();
  showToast(`No.${current.seq} 已暫存，尚未上架`);
}

async function finalizePutawayBatch(){
  const batch = batchesFromItems().find(b=>b.batchId===currentBatchId);
  if(!batch) return;
  const pending = batch.items.filter(i=>i.status==='pending');
  const invalidItem = pending.find(i=>{
    const location = normalizeLocationCode(putawayScanDraft[i.id]?.location || i.location);
    return !isValidLocationCode(location);
  });
  if(invalidItem){
    currentItemId = invalidItem.id;
    render();
    showToast(`請確認 No.${invalidItem.seq} 的儲位格式，例如 AW00A1`);
    return;
  }
  document.body.insertAdjacentHTML('beforeend',`
    <div class="overlay" id="putaway-confirm-overlay" role="dialog" aria-modal="true">
      <div class="putaway-confirm">
        <h3>確認一次上架</h3>
        <p>已完成 ${pending.length} 板掃描，確定要一次上架嗎？</p>
        <div class="confirm-actions">
          <button class="btn btn-primary" id="btn-commit-putaway" type="button">確定</button>
          <button class="btn" id="btn-cancel-putaway" type="button">取消</button>
        </div>
      </div>
    </div>`);
  document.getElementById('btn-cancel-putaway').onclick = ()=>document.getElementById('putaway-confirm-overlay')?.remove();
  document.getElementById('btn-commit-putaway').onclick = ()=>commitPutawayBatch(batch.batchId);
}

async function commitPutawayBatch(batchId){
  document.getElementById('putaway-confirm-overlay')?.remove();
  const batch = batchesFromItems().find(b=>b.batchId===batchId);
  if(!batch) return;
  const pending = batch.items.filter(i=>i.status==='pending');
  pending.forEach(item=>{
    const staged = putawayScanDraft[item.id]||{};
    item.location = normalizeLocationCode(staged.location || item.location);
    item.abnormalText = staged.abnormalText ?? item.abnormalText;
    item.status = 'done';
    syncInventoryForItem(item);
  });
  clearPutawayScanDraftForBatch(batchId);
  await savePutaway();
  await saveRecords();
  currentItemId = null;
  putawaySubTab = 'create';
  render();
  showToast(`🎉 ${pending.length} 板已完成上架`);
}

function stagePalletField(itemId, field, value){
  const item = putawayItems.find(i=>i.id===itemId);
  if(!item) return;
  if(field==='location'){
    const location = normalizeLocationCode(value);
    if(location && !isValidLocationCode(location)){
      showToast('儲位格式錯誤，請使用例如 AW00A1 或 BE12B2');
      render();
      return;
    }
    value = location;
  }
  const staged = putawayScanDraft[itemId]||{};
  putawayScanDraft[itemId] = {...staged,[field]:value};
  savePutawayScanDraft();
  render();
}

function openPutawayBatchDetails(batchId){
  const batch = batchesFromItems().find(b=>b.batchId===batchId);
  if(!batch) return;
  document.body.insertAdjacentHTML('beforeend',`
    <div class="overlay" id="putaway-detail-overlay" role="dialog" aria-modal="true">
      <div class="modal">
        <h3>上架批次明細</h3>
        <div style="color:var(--ink-soft);font-size:13px;margin:-8px 0 14px;">${esc(displayDate(batch.batchDate))}｜共 ${batch.total} 板，已上架 ${batch.done} 板</div>
        <div class="batch-detail-list">
          ${batch.items.map(item=>`<div class="batch-detail-row">
            <b>No.${esc(item.seq)}　${esc(item.sku)}</b><span class="pstatus ${item.status==='done'?'done':'pending'}">${item.status==='done'?'已上架':'待上架'}</span>
            <span class="label">數量</span><span>${esc(item.qty)}</span>
            <span class="label">儲位</span><span class="mono">${esc(item.location)||'—'}</span>
            <span class="label">異常註記</span><span>${esc(item.abnormalText)||'—'}</span>
          </div>`).join('')}
        </div>
        <div class="modal-actions"><button class="btn" id="btn-close-putaway-detail" type="button">關閉</button></div>
      </div>
    </div>`);
  document.getElementById('btn-close-putaway-detail').onclick = ()=>document.getElementById('putaway-detail-overlay')?.remove();
}

async function deleteBatch(batchId){
  if(!confirm('確定要刪除這個上架批次嗎？已上架且已併入庫存的資料不會一併刪除。')) return;
  clearPutawayScanDraftForBatch(batchId);
  putawayItems = putawayItems.filter(i=>i.batchId!==batchId);
  await savePutaway();
  render();
  showToast('批次已刪除');
}

function fifoCandidatesForSku(sku){
  return records
    .filter(r=>r.sku===sku && statusOf(r)==='instock')
    .sort((a,b)=> (a.inboundDate||'').localeCompare(b.inboundDate||'') || String(a.id).localeCompare(String(b.id)));
}

// 出貨單呈現用的自然排序：料號優先，其次為儲位（例如 AB12A1 在 AB39A1 前）。
// 實際挑選仍由 fifoCandidatesForSku 依入倉日先進先出決定。
function compareOutboundDisplay(a,b){
  const compare = (left,right)=>String(left||'').localeCompare(String(right||''),undefined,{numeric:true,sensitivity:'base'});
  return compare(a.sku,b.sku) || compare(a.location,b.location) || compare(a.inboundDate,b.inboundDate);
}

function buildOutboundRow(sku, qty, pallets){
  const candidates = fifoCandidatesForSku(sku);
  const reqPallets = Number(pallets)||0;
  return {
    sku, reqQty: Number(qty)||0, reqPallets,
    candidates: candidates.map(c=>({id:c.id, inboundDate:c.inboundDate, location:c.location, qty:c.qty})),
    selectedIds: candidates.slice(0, reqPallets).map(c=>c.id)
  };
}

function handleOutboundImportFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const result = parseWorkbookLatestDate(wb);
      if(!result){
        showToast('找不到「料號」或「板數」欄位，請確認 Excel 格式'); return;
      }
      const shipDate = result.date;
      const rowsData = result.rows.filter(r=>r.sku && String(r.sku).trim() && Number(r.pallets)>0);
      if(rowsData.length===0){ showToast('未讀取到有效的料號資料'); return; }
      outboundDraft = {
        shipDate,
        shipTime: '',
        shipToName: '', shipToAddress: '', shipToTel: '',
        specialInstructions: '客戶自派',
        rows: rowsData.map(r=>buildOutboundRow(r.sku, r.qty, r.pallets))
      };
      render();
      const multiNote = result.allDates.length>1 ? `（偵測到 ${result.allDates.length} 個日期，已取最新的 ${shipDate}）` : '';
      showToast(`已匯入 ${rowsData.length} 筆料號，已依先進先出自動配對庫存 ${multiNote}`);
    }catch(err){
      showToast('匯入失敗：檔案格式無法解析');
    }
  };
  reader.readAsArrayBuffer(file);
}

function addManualOutboundRow(sku, pallets){
  if(!outboundDraft) outboundDraft = {shipDate:toISO(new Date()), shipTime:'', shipToName:'', shipToAddress:'', shipToTel:'', specialInstructions:'客戶自派', rows:[]};
  outboundDraft.rows.push(buildOutboundRow(sku, 0, pallets));
  render();
}

function toggleOutboundCandidate(rowIdx, recId){
  const row = outboundDraft.rows[rowIdx];
  const i = row.selectedIds.indexOf(recId);
  if(i>=0) row.selectedIds.splice(i,1); else row.selectedIds.push(recId);
  render();
}

function removeOutboundRow(rowIdx){
  outboundDraft.rows.splice(rowIdx,1);
  render();
}

async function confirmOutbound(){
  if(!outboundDraft) return;
  const shipDate = document.getElementById('ob-shipdate').value || outboundDraft.shipDate;
  if(!shipDate){ showToast('請填寫出倉日'); return; }
  const rowsWithSelection = outboundDraft.rows.filter(r=>r.selectedIds.length>0);
  if(rowsWithSelection.length===0){ showToast('請至少選擇一筆要出貨的棧板'); return; }

  outboundDraft.shipDate = shipDate;
  outboundDraft.shipTime = document.getElementById('ob-shiptime') ? document.getElementById('ob-shiptime').value : (outboundDraft.shipTime || '');
  if(!outboundDraft.shipTime) outboundDraft.shipTime = '15:00';
  outboundDraft.shipToName = document.getElementById('ob-shiptoname').value;
  outboundDraft.shipToAddress = document.getElementById('ob-shiptoaddr').value;
  outboundDraft.shipToTel = document.getElementById('ob-shiptotel').value;
  outboundDraft.specialInstructions = document.getElementById('ob-instructions').value;

  outboundDraft.rows.forEach(row=>{
    row.selectedIds.forEach(id=>{
      const rec = records.find(r=>r.id===id);
      if(rec) rec.outboundDate = shipDate;
    });
  });

  const shipment = {
    id: uid(),
    shipDate, shipTime: outboundDraft.shipTime,
    shipToName: outboundDraft.shipToName, shipToAddress: outboundDraft.shipToAddress, shipToTel: outboundDraft.shipToTel,
    specialInstructions: outboundDraft.specialInstructions,
    lines: outboundDraft.rows.map(r=>{
      const actualQty = r.selectedIds.reduce((s,id)=>{
        const rec = records.find(x=>x.id===id); return s+(rec?Number(rec.qty)||0:0);
      },0);
      const fulfilled = r.selectedIds.length===r.reqPallets;
      // 板數完全符合客戶需求時，直接採用客戶出倉單上的數量(組)，
      // 避免庫存資料裡個別棧板數量誤差造成金額對不上；只有出貨不足時才顯示實際加總數量並標記。
      const shippedQty = fulfilled ? r.reqQty : actualQty;
      const pickedPallets = r.selectedIds
        .map(id=>records.find(x=>x.id===id))
        .filter(Boolean)
        .sort((a,b)=> (a.inboundDate||'').localeCompare(b.inboundDate||'') || String(a.id).localeCompare(String(b.id)))
        .map(rec=>({recId:rec.id, inboundDate:rec.inboundDate, qty:rec.qty, pallets:rec.pallets, sku:rec.sku, location:rec.location}));
      return {sku:r.sku, reqQty:r.reqQty, reqPallets:r.reqPallets, shippedPallets:r.selectedIds.length, shippedQty, fulfilled, actualQty, pickedPallets};
    }),
    createdAt: Date.now()
  };
  shipments.push(shipment);
  await saveRecords();
  await saveShipments();
  outboundDraft = null;
  printShipmentId = shipment.id;
  outboundSubTab = 'print';
  render();
  showToast('出貨單已產生');
}

async function downloadDeliveryNotePdf(sid){
  const s = shipments.find(x=>x.id===sid);
  const el = document.getElementById('dn-print-area');
  if(!s || !el || typeof html2pdf==='undefined'){ showToast('PDF 產生失敗，請改用列印功能'); return; }
  const btn = document.getElementById('btn-download-pdf');
  if(btn){ btn.disabled = true; btn.textContent = '產生中…'; }
  // 產生 PDF 前暫時把可編輯欄位變成純文字，避免輸入框邊框被截圖進 PDF
  const fieldEls = el.querySelectorAll('[data-dn-field]');
  const swaps = [];
  fieldEls.forEach(f=>{
    const span = document.createElement('span');
    span.textContent = f.value || '';
    span.style.cssText = 'font-size:13px;font-family:inherit;';
    f.parentNode.insertBefore(span, f);
    f.style.display = 'none';
    swaps.push({f, span});
  });
  document.body.classList.add('pdf-export');
  try{
    // 不使用 html2pdf 的自動分頁：它在手機版會將可捲動表格錯誤切成空白頁。
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    // html2pdf 的 bundle 不一定將 html2canvas、jsPDF 暴露為全域變數，
    // 因此由它自己的 worker 取得畫布與 jsPDF 建構子。
    const worker = html2pdf().set({
      margin:0,
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:el.scrollWidth}
    }).from(el).toCanvas();
    const canvas = await worker.get('canvas');
    const prototypePdf = await worker.toPdf().get('pdf');
    const pdf = new prototypePdf.constructor({unit:'mm',format:'a4',orientation:'portrait'});
    const margin = 8;
    const pageWidth = 210 - margin * 2;
    const pageHeight = 297 - margin * 2;
    const pixelsPerMm = canvas.width / pageWidth;
    const pagePixels = Math.floor(pageHeight * pixelsPerMm);
    for(let top=0,page=0; top<canvas.height; top+=pagePixels,page++){
      const sliceHeight = Math.min(pagePixels,canvas.height-top);
      const slice = document.createElement('canvas');
      slice.width = canvas.width;
      slice.height = sliceHeight;
      const ctx = slice.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,slice.width,slice.height);
      ctx.drawImage(canvas,0,top,canvas.width,sliceHeight,0,0,slice.width,sliceHeight);
      if(page) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg',0.98),'JPEG',margin,margin,pageWidth,sliceHeight/pixelsPerMm);
    }
    pdf.save(`DeliveryNote_${s.shipDate}_${(s.shipToName||'').replace(/[^\w\u4e00-\u9fa5]/g,'')||'Eaton'}.pdf`);
  }catch(err){
    showToast('PDF 產生失敗，請改用列印功能');
  }finally{
    document.body.classList.remove('pdf-export');
    swaps.forEach(({f,span})=>{ f.style.display=''; span.remove(); });
    if(btn){ btn.disabled = false; btn.textContent = '⬇️ 下載 PDF'; }
  }
}

async function deleteShipment(sid){
  const shipment = shipments.find(s=>s.id===sid);
  if(!shipment) return;
  const proceed = confirm('確定要刪除這筆出貨紀錄嗎？相關棧板會還原為「在庫」狀態。');
  if(!proceed) return;
  shipment.lines.forEach(l=>{
    (l.pickedPallets||[]).forEach(p=>{
      if(!p.recId) return;
      const rec = records.find(r=>r.id===p.recId);
      if(rec) rec.outboundDate = null;
    });
  });
  shipments = shipments.filter(s=>s.id!==sid);
  await saveRecords();
  await saveShipments();
  render();
  showToast('已刪除出貨紀錄，相關棧板已還原為在庫');
}

/* =========================================================
   BILLING TAB
========================================================= */
function computeBilling(){
  const start = parseISO(billingPeriod.start);
  const end = parseISO(billingPeriod.end);
  if(!start || !end || start>end) return null;

  const periodDays = daysBetween(start,end)+1;
  // Build daily stock levels for the free-allowance overflow rent model
  const dayStock = new Array(periodDays).fill(0);
  const relevant = records.map(r=>{
    const ib = parseISO(r.inboundDate);
    const ob = r.outboundDate ? parseISO(r.outboundDate) : null;
    return {r, ib, ob};
  }).filter(x=>{
    if(!x.ib) return false;
    const effectiveEnd = x.ob || end; // still in stock -> counts through period end
    return x.ib<=end && effectiveEnd>=start;
  });

  relevant.forEach(({r,ib,ob})=>{
    const effectiveEnd = ob || end;
    const from = ib>start?ib:start;
    const to = effectiveEnd<end?effectiveEnd:end;
    if(to<from) return;
    for(let i=daysBetween(start,from); i<=daysBetween(start,to); i++){
      dayStock[i] += Number(r.pallets)||0;
    }
  });

  const dayExcess = dayStock.map(s=>Math.max(s-settings.freeAllowancePallets,0));
  const totalExcessPalletDays = dayExcess.reduce((a,b)=>a+b,0);
  const totalRentFee = totalExcessPalletDays * settings.rentRatePerPalletDay;

  // per-record pallet-days in period (for proportional rent allocation)
  const recPalletDays = relevant.map(({r,ib,ob})=>{
    const effectiveEnd = ob || end;
    const from = ib>start?ib:start;
    const to = effectiveEnd<end?effectiveEnd:end;
    const days = Math.max(daysBetween(from,to)+1,0);
    return {r, ib, ob, days, palletDays: days*(Number(r.pallets)||0)};
  });
  const sumPalletDays = recPalletDays.reduce((s,x)=>s+x.palletDays,0) || 1;

  let inboundTotal=0, outboundTotal=0, forkliftTotal=0, loadTotal=0, unloadTotal=0, overtimeTotal=0, adjustTotal=0;

  const rows = recPalletDays.map(({r,ib,ob,days,palletDays})=>{
    const pallets = Number(r.pallets)||0;
    const inboundInPeriod = ib>=start && ib<=end;
    const outboundInPeriod = ob && ob>=start && ob<=end;
    const inboundFee = inboundInPeriod ? pallets*settings.inboundFeePerPallet : 0;
    const outboundFee = outboundInPeriod ? pallets*settings.outboundFeePerPallet : 0;
    const forkliftFee = (inboundInPeriod||outboundInPeriod) ? pallets*settings.forkliftFeePerPallet : 0;
    const loadFee = r.loadContainer ? settings.loadContainerFee : 0;
    const unloadFee = r.unloadContainer ? settings.unloadContainerFee : 0;
    const otFee = (Number(r.overtimeWeekdayHours)||0)*settings.overtimeWeekdayRate + (Number(r.overtimeHolidayHours)||0)*settings.overtimeHolidayRate;
    const rentShare = totalRentFee * (palletDays/sumPalletDays);
    const adjust = Number(r.adjustAmount)||0;
    const lineTotal = rentShare+inboundFee+outboundFee+forkliftFee+loadFee+unloadFee+otFee+adjust;

    inboundTotal+=inboundFee; outboundTotal+=outboundFee; forkliftTotal+=forkliftFee;
    loadTotal+=loadFee; unloadTotal+=unloadFee; overtimeTotal+=otFee; adjustTotal+=adjust;

    return {rec:r, days, rentShare, inboundFee, outboundFee, forkliftFee, loadFee, unloadFee, otFee, adjust, lineTotal};
  }).sort((a,b)=>(a.rec.inboundDate||'').localeCompare(b.rec.inboundDate||''));

  const subtotal = rows.reduce((s,x)=>s+x.lineTotal,0);
  const tax = settings.applyTax ? subtotal*(settings.taxRate/100) : 0;
  const grandTotal = subtotal+tax;

  const inboundPallets = relevant.filter(x=>x.ib>=start&&x.ib<=end).reduce((s,x)=>s+(Number(x.r.pallets)||0),0);
  const outboundPallets = relevant.filter(x=>x.ob&&x.ob>=start&&x.ob<=end).reduce((s,x)=>s+(Number(x.r.pallets)||0),0);
  const currentStock = dayStock[dayStock.length-1]||0;
  const maxExcess = Math.max(...dayExcess,0);

  return { rows, totalRentFee, inboundTotal, outboundTotal, forkliftTotal, loadTotal, unloadTotal, overtimeTotal, adjustTotal,
    subtotal, tax, grandTotal, inboundPallets, outboundPallets, currentStock, maxExcess };
}

        <td><input type="number" class="mini-input" data-bfield="overtimeWeekdayHours" value="${r.overtimeWeekdayHours||0}" min="0" step="0.5"></td>
        <td><input type="number" class="mini-input" data-bfield="overtimeHolidayHours" value="${r.overtimeHolidayHours||0}" min="0" step="0.5"></td>
        <td><input type="number" class="mini-input wide" data-bfield="adjustAmount" value="${r.adjustAmount||0}" step="1"></td>
        <td class="num" style="font-weight:600;">${fmtMoney(row.lineTotal)}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>
  </div>
  <div class="totals-panel">
    <div class="item"><div class="l">倉租合計</div><div class="v">${fmtMoney(b.totalRentFee)}</div></div>
    <div class="item"><div class="l">進倉手續費</div><div class="v">${fmtMoney(b.inboundTotal)}</div></div>
    <div class="item"><div class="l">出倉手續費</div><div class="v">${fmtMoney(b.outboundTotal)}</div></div>
    <div class="item"><div class="l">堆高機費</div><div class="v">${fmtMoney(b.forkliftTotal)}</div></div>
    <div class="item"><div class="l">裝拆櫃費</div><div class="v">${fmtMoney(b.loadTotal+b.unloadTotal)}</div></div>
    <div class="item"><div class="l">加班費</div><div class="v">${fmtMoney(b.overtimeTotal)}</div></div>
    <div class="item"><div class="l">調整金額</div><div class="v">${fmtMoney(b.adjustTotal)}</div></div>
    <div class="item"><div class="l">未稅小計</div><div class="v">${fmtMoney(b.subtotal)}</div></div>
    ${settings.applyTax ? `<div class="item"><div class="l">稅額 (${settings.taxRate}%)</div><div class="v">${fmtMoney(b.tax)}</div></div>` : ''}
    <div class="item grand"><div class="l">請款總額${settings.applyTax?'(含稅)':'(未稅)'}</div><div class="v">${fmtMoney(b.grandTotal)}</div></div>
  </div>
  `;
}

function updateBillingField(id, field, value){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  if(field==='loadContainer'||field==='unloadContainer') r[field] = value;
  else r[field] = value===''?0:Number(value);
  saveRecords();
  // re-render just totals/table without losing focus on other rows is complex;
  // recompute and patch in place for the edited row's line total + panel.
  const b = computeBilling();
  if(!b) return;
  document.querySelector('main').querySelector('.table-wrap')?.parentElement;
  const container = document.getElementById('main');
  const tableWrapAndTotals = renderBillingTable(b);
  const statRow = container.querySelector('.stat-row');
  const tableWrap = container.querySelector('.table-wrap');
  const totalsPanel = container.querySelector('.totals-panel');
  const tmp = document.createElement('div');
  tmp.innerHTML = tableWrapAndTotals;
  if(statRow) statRow.replaceWith(tmp.querySelector('.stat-row'));
  if(tableWrap) tableWrap.replaceWith(tmp.querySelector('.table-wrap'));
  if(totalsPanel) totalsPanel.replaceWith(tmp.querySelector('.totals-panel'));
  attachHandlers();
}

function exportBilling(){
  const b = computeBilling();
  if(!b) return;
  const data = b.rows.map(row=>({
    '進倉日期':row.rec.inboundDate,'SKU':row.rec.sku,'出貨日期':row.rec.outboundDate||'',
    '棧板數':row.rec.pallets,'期間天數':row.days,'倉租分攤':Math.round(row.rentShare),
    '進倉費':row.inboundFee,'出倉費':row.outboundFee,'堆高機':row.forkliftFee,
    '裝櫃費':row.loadFee,'拆櫃費':row.unloadFee,
    '加班費平日':(row.rec.overtimeWeekdayHours||0)*settings.overtimeWeekdayRate,
    '加班費假日':(row.rec.overtimeHolidayHours||0)*settings.overtimeHolidayRate,
    '調整金額':row.adjust,'小計':Math.round(row.lineTotal)
  }));
  data.push({'進倉日期':'','SKU':'','出貨日期':'','棧板數':'','期間天數':'','倉租分攤':'','進倉費':'','出倉費':'','堆高機':'','裝櫃費':'','拆櫃費':'','加班費平日':'','加班費假日':'','調整金額':'請款總額','小計':Math.round(b.grandTotal)});
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '請款明細');
  XLSX.writeFile(wb, `Eaton蘆竹UPS_請款單_${billingPeriod.start}_${billingPeriod.end}.xlsx`);
}
