/* =========================================================
   Event wiring
========================================================= */
function attachHandlers(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{
      activeTab = b.dataset.tab;
      resetTabView(activeTab);
      render();
    };
  });

  if(activeTab==='inventory'){
    const searchEl = document.getElementById('inv-search');
    if(searchEl) searchEl.oninput = (e)=>{ invFilter.q = e.target.value; render(); document.getElementById('inv-search').focus(); document.getElementById('inv-search').selectionStart = document.getElementById('inv-search').value.length; };
    const statusEl = document.getElementById('inv-status');
    if(statusEl) statusEl.onchange = (e)=>{ invFilter.status = e.target.value; render(); };
    const addBtn = document.getElementById('btn-add');
    if(addBtn) addBtn.onclick = ()=>openRecordModal(null);
    const importBtn = document.getElementById('btn-import');
    const fileInput = document.getElementById('import-file');
    if(importBtn) importBtn.onclick = ()=>fileInput.click();
    if(fileInput) fileInput.onchange = (e)=>{ if(e.target.files[0]) handleImportFile(e.target.files[0]); e.target.value=''; };
    const exportBtn = document.getElementById('btn-export-inv');
    if(exportBtn) exportBtn.onclick = exportInventory;

    document.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        const rec = records.find(r=>r.id===id);
        if(btn.dataset.act==='edit') openRecordModal(rec);
        else if(btn.dataset.act==='ship'){
          const d = prompt('請輸入出貨日期 (YYYY-MM-DD)', toISO(new Date()));
          if(d){ rec.outboundDate = d; await saveRecords(); render(); showToast('已標記出貨'); }
        } else if(btn.dataset.act==='unship'){
          rec.outboundDate = null; await saveRecords(); render(); showToast('已取消出貨標記');
        } else if(btn.dataset.act==='del'){
          if(confirm(`確定要刪除 SKU「${rec.sku}」這筆資料嗎？`)){
            records = records.filter(r=>r.id!==id); await saveRecords(); render(); showToast('已刪除');
          }
        }
      };
    });
  }

  if(activeTab==='billing'){
    const s = document.getElementById('bp-start');
    const en = document.getElementById('bp-end');
    const genBtn = document.getElementById('btn-gen-bill');
    if(genBtn) genBtn.onclick = ()=>{
      billingPeriod.start = document.getElementById('bp-start').value;
      billingPeriod.end = document.getElementById('bp-end').value;
      if(!billingPeriod.start||!billingPeriod.end){ showToast('請選擇起訖日期'); return; }
      render();
    };
    const exBtn = document.getElementById('btn-export-bill');
    if(exBtn) exBtn.onclick = exportBilling;

    document.querySelectorAll('[data-bfield]').forEach(input=>{
      const evt = input.type==='checkbox' ? 'change' : 'input';
      input[evt==='change'?'onchange':'oninput'] = (e)=>{
        const row = input.closest('[data-bid]');
        const id = row.dataset.bid;
        const val = input.type==='checkbox' ? input.checked : input.value;
        updateBillingField(id, input.dataset.bfield, val);
      };
    });
  }

  if(activeTab==='settings'){
    const btn = document.getElementById('btn-save-settings');
    if(btn) btn.onclick = saveSettingsFromForm;
  }

  if(activeTab==='putaway'){
    document.querySelectorAll('.sub-tabs button').forEach(b=>{
      b.onclick = ()=>{ putawaySubTab = b.dataset.subtab; currentItemId=null; render(); };
    });

    if(putawaySubTab==='create'){
      const importBtn = document.getElementById('btn-pw-import');
      const importFile = document.getElementById('pw-import-file');
      if(importBtn) importBtn.onclick = ()=>importFile.click();
      if(importFile) importFile.onchange = (e)=>{ if(e.target.files[0]) handlePutawayImportFile(e.target.files[0]); e.target.value=''; };

      const dateEl = document.getElementById('pw-date');
      if(dateEl) dateEl.oninput = (e)=>{ draftDate = e.target.value; };

      document.querySelectorAll('#draft-rows input[data-field]').forEach(inp=>{
        inp.oninput = (e)=>{ draftRows[Number(inp.dataset.idx)][inp.dataset.field] = e.target.value; };
      });
      document.querySelectorAll('[data-act="del-row"]').forEach(btn=>{
        btn.onclick = ()=>{
          draftRows.splice(Number(btn.dataset.idx),1);
          if(draftRows.length===0) draftRows.push({sku:'',qty:'',pallets:''});
          render();
        };
      });
      const addRowBtn = document.getElementById('btn-add-row');
      if(addRowBtn) addRowBtn.onclick = ()=>{ draftRows.push({sku:'',qty:'',pallets:''}); render(); };
      const createBtn = document.getElementById('btn-create-batch');
      if(createBtn) createBtn.onclick = createPutawayBatch;

      document.querySelectorAll('[data-act="goto-scan"]').forEach(btn=>{
        btn.onclick = ()=>{ currentBatchId = btn.dataset.bid; currentItemId=null; putawaySubTab='scan'; render(); };
      });
      document.querySelectorAll('[data-act="view-batch"]').forEach(btn=>{
        btn.onclick = ()=>openPutawayBatchDetails(btn.dataset.bid);
      });
      document.querySelectorAll('[data-act="del-batch"]').forEach(btn=>{
        btn.onclick = ()=>deleteBatch(btn.dataset.bid);
      });
    }

    if(putawaySubTab==='scan'){
      const sel = document.getElementById('pw-batch-select');
      if(sel) sel.onchange = (e)=>{ currentBatchId = e.target.value; currentItemId=null; render(); };
      const goCreateBtn = document.getElementById('btn-go-putaway-create');
      if(goCreateBtn) goCreateBtn.onclick = ()=>{ putawaySubTab='create'; currentItemId=null; render(); };

      const confirmBtn = document.getElementById('pw-confirm-btn');
      const scanInput = document.getElementById('pw-scan-input');
      const abnInput = document.getElementById('pw-scan-abnormal');
      const cameraBtn = document.getElementById('btn-open-location-camera');
      const finalizeBtn = document.getElementById('btn-finalize-putaway');
      const doConfirm = ()=>stagePutaway(scanInput.value, abnInput.value);
      if(confirmBtn) confirmBtn.onclick = doConfirm;
      if(cameraBtn) cameraBtn.onclick = startLocationCameraScan;
      if(finalizeBtn) finalizeBtn.onclick = finalizePutawayBatch;
      if(scanInput) scanInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doConfirm(); } };
      if(abnInput) abnInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doConfirm(); } };

      document.querySelectorAll('[data-act="jump-item"]').forEach(btn=>{
        btn.onclick = ()=>{ currentItemId = btn.dataset.itemId; render(); };
      });
      document.querySelectorAll('[data-pfield]').forEach(inp=>{
        inp.onchange = (e)=>stagePalletField(inp.dataset.itemId, inp.dataset.pfield, e.target.value);
      });
      document.querySelectorAll('.pallet-card').forEach(card=>{
        card.onclick = (e)=>{
          if(e.target.tagName==='INPUT' || e.target.tagName==='BUTTON') return;
          currentItemId = card.dataset.itemId; render();
        };
      });
    }
  }

  if(activeTab==='outbound'){
    document.querySelectorAll('.sub-tabs button[data-obsubtab]').forEach(b=>{
      b.onclick = ()=>{ outboundSubTab = b.dataset.obsubtab; render(); };
    });

    if(outboundSubTab==='print' && printShipmentId){
      const backBtn = document.getElementById('btn-back-to-outbound');
      if(backBtn) backBtn.onclick = ()=>{ printShipmentId=null; outboundSubTab='history'; render(); };
      const printBtn = document.getElementById('btn-print-dn');
      if(printBtn) printBtn.onclick = ()=>window.print();
      const downloadBtn = document.getElementById('btn-download-pdf');
      if(downloadBtn) downloadBtn.onclick = ()=>downloadDeliveryNotePdf(printShipmentId);
      document.querySelectorAll('[data-dn-field]').forEach(inp=>{
        inp.onchange = async (e)=>{
          const s = shipments.find(x=>x.id===printShipmentId);
          if(!s) return;
          s[inp.dataset.dnField] = e.target.value;
          await saveShipments();
        };
      });
    } else if(outboundSubTab==='history'){
      document.querySelectorAll('[data-act="view-shipment"]').forEach(btn=>{
        btn.onclick = ()=>{ printShipmentId = btn.dataset.sid; outboundSubTab='print'; render(); };
      });
      document.querySelectorAll('[data-act="del-shipment"]').forEach(btn=>{
        btn.onclick = ()=>deleteShipment(btn.dataset.sid);
      });
    } else {
      const importBtn = document.getElementById('ob-import-btn');
      const importFile = document.getElementById('ob-import-file');
      if(importBtn) importBtn.onclick = ()=>importFile.click();
      if(importFile) importFile.onchange = (e)=>{ if(e.target.files[0]) handleOutboundImportFile(e.target.files[0]); e.target.value=''; };

      if(outboundDraft){
        const fieldMap = {'ob-shipdate':'shipDate','ob-shiptoname':'shipToName','ob-shiptoaddr':'shipToAddress','ob-shiptotel':'shipToTel','ob-instructions':'specialInstructions'};
        Object.keys(fieldMap).forEach(elId=>{
          const el = document.getElementById(elId);
          if(el) el.oninput = (e)=>{ outboundDraft[fieldMap[elId]] = e.target.value; };
        });
      }

      document.querySelectorAll('[data-act="toggle-ob-cand"]').forEach(cb=>{
        cb.onchange = ()=>toggleOutboundCandidate(Number(cb.dataset.row), cb.dataset.recid);
      });
      document.querySelectorAll('[data-act="remove-ob-row"]').forEach(btn=>{
        btn.onclick = ()=>removeOutboundRow(Number(btn.dataset.idx));
      });
      const cancelBtn = document.getElementById('btn-ob-cancel');
      if(cancelBtn) cancelBtn.onclick = ()=>{ if(confirm('確定要清空目前的出貨單草稿嗎？')){ outboundDraft=null; render(); } };
      const confirmBtn = document.getElementById('btn-ob-confirm');
      if(confirmBtn) confirmBtn.onclick = confirmOutbound;
    }
  }
}

        請依照以下步驟設定（約 10 分鐘，一次設定好即可）：
      </p>

        小提醒：測試模式的資料庫預設 30 天後會鎖住讀寫，屆時需要調整安全規則（我會一併提供設定內容），請放心，我會提醒您。
      </p>

/* =========================================================
   Init
========================================================= */
(async function init(){
  if(!FIREBASE_CONFIGURED){
    renderSetupScreen();
    return;
  }
  await loadState();
  render();
})();
</script>
